[project]
name = "jrif"
version = "0.1.2"
description = "Peptide retention-time and ion-mobility prediction: pretrained bases, per-experiment calibration, full-library prediction."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "Daniel Geiszler", email = "dgeiszler@parallelsq.org" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.2",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/danielgeiszler/JRIF"

[tool.hatch.build.targets.wheel]
packages = ["src/jrif"]
# ship the .pt weights inside the wheel
artifacts = ["src/jrif/checkpoints/*.pt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
jrif-train-label-free = "jrif.training.train_label_free:main"
jrif-train-psmtag     = "jrif.training.train_psmtag:main"
jrif-train-im         = "jrif.training.train_im:main"
jrif-predict          = "jrif.predict_library:main"
