[project]
name = "jrif"
version = "0.1.0"
description = "Retention time prediction for proteomics peptides. Trains a label-free model on a DIA-NN library, fine-tunes to a modified-peptide (PSMtag) library, and predicts RT for arbitrary spectral libraries."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.2",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=14",
    "tensorboard>=2.15",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
jrif-train-label-free = "jrif.train_label_free:main"
jrif-train-psmtag     = "jrif.train_psmtag:main"
jrif-predict          = "jrif.predict_library:main"
