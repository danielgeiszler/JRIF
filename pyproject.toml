[project]
name = "jrif"
version = "0.1.0"
description = "Retention time prediction for proteomics peptides. Trains a label-free model on a DIA-NN library, fine-tunes to a modified-peptide (PSMtag) library, and predicts RT for arbitrary spectral libraries."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.2",
    "pandas>=2.0",
    "tensorboard>=2.15",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
jrif-train-library = "jrif.train_library:main"
jrif-train-psmtag  = "jrif.train_psmtag:main"
jrif-predict       = "jrif.predict_library:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
